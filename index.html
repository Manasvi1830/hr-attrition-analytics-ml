<!DOCTYPE html>
<html>
<head>
    <title>Employee Attrition Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="text-center mb-4">Employee Attrition Prediction System</h2>

        <form action="/predict" method="post">

            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" name="Age" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Monthly Income</label>
                <input type="number" name="MonthlyIncome" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Years At Company</label>
                <input type="number" name="YearsAtCompany" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Years Since Last Promotion</label>
                <input type="number" name="YearsSinceLastPromotion" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Overtime</label>
                <select name="Overtime" class="form-select" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Predict Attrition Risk
            </button>

        </form>
    </div>
</div>

</body>
</html>
